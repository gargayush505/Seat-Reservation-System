spring:
  application:
    name: seat-reservation
  datasource:
    url: jdbc:oracle:thin:@localhost:1522/FREEPDB1
    username: SYSTEM
    password: Oracle123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: seat-reservation

app:
  auth:
    admin-token: ${ADMIN_TOKEN:admin-local}
  reservation:
    default-per-user-limit: ${DEFAULT_PER_USER_LIMIT:4}
