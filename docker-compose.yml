services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Oracle123
      APP_USER: SYSTEM
      APP_USER_PASSWORD: Oracle123
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1522/FREEPDB1
      DB_USERNAME: SYSTEM
      DB_PASSWORD: Oracle123
      ADMIN_TOKEN: admin-local
      PORT: 8080
    ports:
      - "8080:8080"
